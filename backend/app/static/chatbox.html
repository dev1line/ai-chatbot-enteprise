<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backend Chatbox Test</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --text: #172033;
            --muted: #5d6a82;
            --border: #d7e1ee;
            --primary: #0068d1;
            --primary-dark: #0055ab;
            --assistant: #edf4ff;
            --assistant-border: #c9defd;
            --user: #d9f2e5;
            --user-border: #a8ddc0;
            --danger: #b42318;
            --surface: #f8fbff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", "Noto Sans", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 0% 0%, #d7ebff 0%, transparent 36%),
                radial-gradient(circle at 100% 0%, #d9f7e9 0%, transparent 30%),
                var(--bg);
        }

        .wrap {
            max-width: 980px;
            margin: 28px auto;
            padding: 0 16px;
            display: grid;
            gap: 14px;
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            box-shadow: 0 14px 30px rgba(23, 32, 51, 0.07);
        }

        h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 0.2px;
        }

        p {
            margin: 6px 0 0;
            color: var(--muted);
            line-height: 1.4;
        }

        .head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .mode-pill {
            border: 1px solid var(--assistant-border);
            background: var(--assistant);
            color: #0e3f77;
            font-weight: 700;
            font-size: 12px;
            border-radius: 999px;
            padding: 6px 10px;
            white-space: nowrap;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        button {
            border-radius: 12px;
            border: none;
            min-height: 42px;
            padding: 0 14px;
            font-size: 14px;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.12s ease, background 0.12s ease;
        }

        button:active {
            transform: translateY(1px);
        }

        button:hover {
            background: var(--primary-dark);
        }

        button.secondary {
            background: #fff;
            color: var(--text);
            border: 1px solid var(--border);
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .state {
            margin-top: 10px;
            color: var(--muted);
            font-size: 13px;
        }

        .error {
            color: var(--danger);
            font-weight: 600;
            margin-top: 8px;
        }

        .chat {
            height: 58vh;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 4px 4px 2px;
            background: var(--surface);
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .msg-row {
            display: flex;
            width: 100%;
        }

        .msg-row.user {
            justify-content: flex-end;
        }

        .msg-row.assistant {
            justify-content: flex-start;
        }

        .msg {
            width: fit-content;
            max-width: min(84%, 700px);
            border-radius: 14px;
            border: 1px solid var(--border);
            padding: 10px 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: 0 4px 14px rgba(23, 32, 51, 0.06);
        }

        .msg.user {
            background: var(--user);
            border-color: var(--user-border);
            border-bottom-right-radius: 6px;
        }

        .msg.assistant {
            background: var(--assistant);
            border-color: var(--assistant-border);
            border-bottom-left-radius: 6px;
        }

        .msg-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 4px;
        }

        .who {
            font-size: 12px;
            font-weight: 700;
            color: #2e3a4f;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .meta {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed rgba(46, 58, 79, 0.2);
            font-size: 12px;
            color: var(--muted);
        }

        .empty {
            margin: auto;
            text-align: center;
            color: var(--muted);
            max-width: 420px;
            padding: 16px;
        }

        .empty strong {
            display: block;
            margin-bottom: 6px;
            color: var(--text);
        }

        .typing {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            min-height: 14px;
        }

        .typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #3f7bb8;
            animation: pulse 1.2s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse {

            0%,
            80%,
            100% {
                transform: scale(0.8);
                opacity: 0.45;
            }

            40% {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        .composer {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            margin-top: 12px;
        }

        input {
            border-radius: 12px;
            border: 1px solid var(--border);
            min-height: 44px;
            padding: 0 14px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #9bc6f5;
            box-shadow: 0 0 0 3px rgba(0, 104, 209, 0.12);
        }

        @media (max-width: 820px) {
            .head {
                align-items: flex-start;
            }

            .msg {
                max-width: 94%;
            }

            .composer {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="wrap">
        <section class="panel">
            <div class="head">
                <div>
                    <h1>Backend Chatbox Test</h1>
                    <p>No login required. The server calls Azure OpenAI directly with OPENAI_API_KEY.</p>
                </div>
                <div class="mode-pill">API KEY MODE</div>
            </div>
            <div class="actions">
                <button id="clearBtn" class="secondary">Clear History</button>
            </div>
            <div class="state" id="state">History size: 0</div>
            <div class="error" id="error"></div>
        </section>

        <section class="panel">
            <div class="chat" id="chat"></div>
            <form class="composer" id="composer">
                <input id="prompt" placeholder="Type a message..." />
                <button id="sendBtn" type="submit">Send</button>
            </form>
        </section>
    </main>

    <script>
        const HISTORY_KEY = "chatbox_public_history";

        const stateEl = document.getElementById("state");
        const errorEl = document.getElementById("error");
        const chatEl = document.getElementById("chat");
        const promptEl = document.getElementById("prompt");
        const sendBtn = document.getElementById("sendBtn");

        let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");

        function saveHistory() {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            stateEl.textContent = `History size: ${history.length}`;
        }

        function showError(message) {
            errorEl.textContent = message || "";
        }

        function roleLabel(role) {
            return role === "user" ? "You" : "Assistant";
        }

        function addMessage(role, content, usage) {
            const row = document.createElement("div");
            row.className = `msg-row ${role}`;

            const node = document.createElement("div");
            node.className = `msg ${role}`;

            const head = document.createElement("div");
            head.className = "msg-head";

            const who = document.createElement("span");
            who.className = "who";
            who.textContent = roleLabel(role);
            head.appendChild(who);

            node.appendChild(head);

            const text = document.createElement("div");
            text.textContent = content;
            node.appendChild(text);

            if (usage) {
                const meta = document.createElement("div");
                meta.className = "meta";
                meta.textContent = `Tokens - prompt: ${usage.prompt_tokens}, completion: ${usage.completion_tokens}, total: ${usage.total_tokens}`;
                node.appendChild(meta);
            }

            row.appendChild(node);
            chatEl.appendChild(row);
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        function showEmptyState() {
            chatEl.innerHTML = `
        <div class="empty">
          <strong>Start a conversation</strong>
          Ask anything and test the backend response flow with your configured OPENAI_API_KEY.
        </div>
      `;
        }

        function showTyping() {
            const row = document.createElement("div");
            row.className = "msg-row assistant";
            row.id = "typing-row";
            row.innerHTML = `
        <div class="msg assistant">
          <div class="msg-head"><span class="who">Assistant</span></div>
          <div class="typing"><span></span><span></span><span></span></div>
        </div>
      `;
            chatEl.appendChild(row);
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        function hideTyping() {
            const node = document.getElementById("typing-row");
            if (node) node.remove();
        }

        async function api(path, options = {}) {
            const headers = {
                "Content-Type": "application/json",
                ...(options.headers || {}),
            };

            const res = await fetch(path, { ...options, headers });
            const body = await res.json().catch(() => ({}));
            if (!res.ok) {
                throw new Error(body.detail || `HTTP ${res.status}`);
            }
            return body;
        }

        function renderFromHistory() {
            chatEl.innerHTML = "";
            if (!history.length) {
                showEmptyState();
            }
            for (const item of history) {
                addMessage(item.role, item.content);
            }
            saveHistory();
        }

        async function sendPrompt(event) {
            event.preventDefault();
            showError("");
            const message = promptEl.value.trim();
            if (!message) return;

            promptEl.value = "";
            sendBtn.disabled = true;
            history.push({ role: "user", content: message });
            if (history.length === 1) {
                chatEl.innerHTML = "";
            }
            addMessage("user", message);
            saveHistory();
            showTyping();

            try {
                const payloadHistory = history
                    .slice(0, -1)
                    .filter((m) => (m.role === "user" || m.role === "assistant") && String(m.content || "").trim().length > 0);
                const data = await api("/api/public/chat/completions", {
                    method: "POST",
                    body: JSON.stringify({ message, history: payloadHistory }),
                });

                hideTyping();
                const answer = String(data.answer || "").trim();
                if (!answer) {
                    showError("Assistant trả về nội dung rỗng. Vui lòng gửi lại câu hỏi.");
                    return;
                }

                history.push({ role: "assistant", content: answer });
                addMessage("assistant", answer, data.usage);
                saveHistory();
            } catch (err) {
                hideTyping();
                showError(err.message || "Request failed");
            } finally {
                sendBtn.disabled = false;
            }
        }

        function clearHistory() {
            history = [];
            renderFromHistory();
            showError("");
        }

        document.getElementById("composer").addEventListener("submit", sendPrompt);
        document.getElementById("clearBtn").addEventListener("click", clearHistory);

        renderFromHistory();
    </script>
</body>

</html>
